Name                      : "ASR-Transformer"

###### Tokenization ------------------------------------------------------------
tokenization:
  token_type                : "5k"       # [char, 1k, 5k, 10k]
  token_map:
    char: hw4lib/data/tokenizer_jsons/tokenizer_char.json
    "1k": hw4lib/data/tokenizer_jsons/tokenizer_1000.json
    "5k": hw4lib/data/tokenizer_jsons/tokenizer_5000.json
    "10k": hw4lib/data/tokenizer_jsons/tokenizer_10000.json

###### Dataset -----------------------------------------------------------------
data:
  root                 : "./hw4_data/hw4p2_data"  # Set the root path of your data
  train_partition      : "train-clean-100"
  val_partition        : "dev-clean"
  test_partition       : "test-clean"
  subset               : 1.0
  batch_size           : 32
  NUM_WORKERS          : 2
  norm                 : 'global_mvn'  # ['global_mvn', 'cepstral', 'none']
  num_feats            : 80

  ###### SpecAugment ---------------------------------------------------------------
  specaug                   : true
  specaug_conf:
    apply_freq_mask         : True
    freq_mask_width_range   : 10
    num_freq_mask           : 2
    apply_time_mask         : True
    time_mask_width_range   : 50
    num_time_mask           : 2

###### Network Specs -------------------------------------------------------------
model:
  input_dim: 80
  time_reduction: 2
  reduction_method: 'conv'

  d_model: 384
  num_encoder_layers: 4
  num_decoder_layers: 6
  num_encoder_heads: 6
  num_decoder_heads: 6
  d_ff_encoder: 1536
  d_ff_decoder: 1536
  skip_encoder_pe: False
  skip_decoder_pe: False

  dropout: 0.1
  layer_drop_rate: 0.1
  weight_tying: true

###### Common Training Parameters ------------------------------------------------
training:
  use_wandb                   : True
  wandb_run_id                : "none"
  resume                      : none
  gradient_accumulation_steps : 1
  wandb_project               : "hw4p2"

###### Loss ----------------------------------------------------------------------
loss:
  label_smoothing: 0.1
  ctc_weight: 0.2

###### Optimizer -----------------------------------------------------------------
optimizer:
  name: "adamw"
  lr: 0.0001
  weight_decay: 0.000001

  param_groups:
    - name: self_attn
      patterns: ["self_attn"]
      lr: 0.0001
      layer_decay:
        enabled: False
        decay_rate: 0.8

    - name: ffn
      patterns: ["ffn"]
      lr: 0.0001
      layer_decay:
        enabled: False
        decay_rate: 0.8

  layer_decay:
    enabled: False
    decay_rate: 0.75

  sgd:
    momentum: 0.9
    nesterov: True
    dampening: 0

  adam:
    betas: [0.9, 0.999]
    eps: 1.0e-8
    amsgrad: False

  adamw:
    betas: [0.9, 0.999]
    eps: 1.0e-8
    amsgrad: False

###### Scheduler -----------------------------------------------------------------
scheduler:
  name: "cosine"

  reduce_lr:
    mode: "min"
    factor: 0.8
    patience: 3
    threshold: 0.0001
    threshold_mode: "rel"
    cooldown: 0
    min_lr: 1e-7
    eps: 1e-8

  cosine:
    T_max: 45
    eta_min: 0.0000001
    last_epoch: -1

  cosine_warm:
    T_0: 10
    T_mult: 10
    eta_min: 0.0000001
    last_epoch: -1

  warmup:
    enabled: True
    type: "exponential"
    epochs: 5
    start_factor: 0.1
    end_factor: 1.0
